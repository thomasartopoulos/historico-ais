name: Reparar CSV y exportar para QGIS

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  reparar_exportar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalizar eventos_puerto y generar export QGIS
        run: |
          python3 - <<'PYEOF2'
          import csv, json, glob, os
          import urllib.request

          BASE_MAPA = "https://raw.githubusercontent.com/thomasartopoulos/ais-parana-map/main/data"
          CAMPOS = ["fecha", "hora", "puerto", "mmsi", "nombre", "distancia_m", "zona", "lat", "lon"]
          CAMPOS_QGIS = ["fecha", "hora", "mmsi", "nombre", "puerto", "puerto_lat", "puerto_lon", "lat", "lon", "distancia_m", "zona"]


          def bajar_json(url):
              with urllib.request.urlopen(url, timeout=30) as resp:
                  return json.loads(resp.read().decode("utf-8"))


          # --- coordenadas de puertos ---
          puertos_gj = bajar_json(f"{BASE_MAPA}/puertos.geojson")
          coords_puerto = {}
          for f in puertos_gj["features"]:
              lon, lat = f["geometry"]["coordinates"]
              coords_puerto[f["properties"]["nombre"]] = (lat, lon)

          filas_qgis_todas = []

          for path in sorted(glob.glob("data/eventos_puerto/*.csv")):
              filas_normalizadas = []
              with open(path, newline="", encoding="utf-8") as f:
                  r = csv.reader(f)
                  next(r, None)  # descartamos el header viejo, sea cual sea
                  for row in r:
                      if len(row) == 7:
                          fila = dict(zip(CAMPOS[:7], row))
                          fila["lat"] = ""
                          fila["lon"] = ""
                      elif len(row) == 9:
                          fila = dict(zip(CAMPOS, row))
                      else:
                          continue  # fila corrupta, se descarta
                      filas_normalizadas.append(fila)

              # reescribe el archivo con header unificado (arregla la desalineacion)
              with open(path, "w", newline="", encoding="utf-8") as f:
                  w = csv.DictWriter(f, fieldnames=CAMPOS)
                  w.writeheader()
                  w.writerows(filas_normalizadas)

              print(f"{path}: {len(filas_normalizadas)} filas normalizadas")

              for fila in filas_normalizadas:
                  if not fila["lat"] or not fila["lon"]:
                      continue
                  plat, plon = coords_puerto.get(fila["puerto"], ("", ""))
                  filas_qgis_todas.append({
                      "fecha": fila["fecha"], "hora": fila["hora"], "mmsi": fila["mmsi"], "nombre": fila["nombre"],
                      "puerto": fila["puerto"], "puerto_lat": plat, "puerto_lon": plon,
                      "lat": fila["lat"], "lon": fila["lon"], "distancia_m": fila["distancia_m"], "zona": fila["zona"],
                  })

          os.makedirs("data", exist_ok=True)
          with open("data/export_qgis_paradas.csv", "w", newline="", encoding="utf-8") as f:
              w = csv.DictWriter(f, fieldnames=CAMPOS_QGIS)
              w.writeheader()
              w.writerows(filas_qgis_todas)

          print(f"OK: data/export_qgis_paradas.csv con {len(filas_qgis_todas)} filas")
          PYEOF2

      - name: Commit y push
        run: |
          git config user.name "ais-bot"
          git config user.email "ais-bot@users.noreply.github.com"
          git add data/eventos_puerto data/export_qgis_paradas.csv
          git diff --staged --quiet || (git commit -m "Repara eventos_puerto y genera export QGIS" && git push)
